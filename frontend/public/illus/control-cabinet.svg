<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <g stroke="currentColor" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== enclosure: gentle 2.5D box, front-right view (depth vector 14,-14) ===== -->

    <!-- right side face (shaded) -->
    <path d="M188 46 L202 32 L202 192 L188 206 Z" fill="currentColor" opacity="0.12" stroke="none"/>
    <path d="M188 46 L202 32 L202 192 L188 206 Z" stroke-width="2.5"/>

    <!-- top face -->
    <path d="M72 46 L86 32 L202 32 L188 46 Z" fill="currentColor" opacity="0.06" stroke="none"/>
    <path d="M72 46 L86 32 L202 32 L188 46 Z" stroke-width="2.5"/>

    <!-- ventilation slots on top face (parallel to the shear) -->
    <g stroke-width="1.5" opacity="0.85">
      <line x1="88" y1="36" x2="192" y2="36"/>
      <line x1="85" y1="39" x2="189" y2="39"/>
      <line x1="82" y1="42" x2="186" y2="42"/>
    </g>

    <!-- ===== front face / opening ===== -->
    <rect x="72" y="46" width="116" height="160" rx="4" fill="currentColor" opacity="0.06" stroke="none"/>
    <rect x="72" y="46" width="116" height="160" rx="4"/>

    <!-- inner mounting-plate frame -->
    <rect x="79" y="54" width="102" height="144" rx="3" stroke-width="1.5"/>
    <!-- corner mounting screws -->
    <g stroke-width="1.5">
      <g transform="translate(85,60)"><circle r="2.4"/><line x1="-1.6" y1="-1.6" x2="1.6" y2="1.6"/></g>
      <g transform="translate(175,60)"><circle r="2.4"/><line x1="1.6" y1="-1.6" x2="-1.6" y2="1.6"/></g>
      <g transform="translate(85,192)"><circle r="2.4"/><line x1="1.6" y1="-1.6" x2="-1.6" y2="1.6"/></g>
      <g transform="translate(175,192)"><circle r="2.4"/><line x1="-1.6" y1="-1.6" x2="1.6" y2="1.6"/></g>
    </g>

    <!-- ===== interior fit-out ===== -->

    <!-- top terminal strip -->
    <rect x="84" y="62" width="92" height="12" rx="2" fill="currentColor" opacity="0.06" stroke="none"/>
    <rect x="84" y="62" width="92" height="12" rx="2" stroke-width="1.5"/>
    <g stroke-width="1.5">
      <line x1="94" y1="65" x2="94" y2="71"/>
      <line x1="106" y1="65" x2="106" y2="71"/>
      <line x1="118" y1="65" x2="118" y2="71"/>
      <line x1="130" y1="65" x2="130" y2="71"/>
      <line x1="142" y1="65" x2="142" y2="71"/>
      <line x1="154" y1="65" x2="154" y2="71"/>
      <line x1="166" y1="65" x2="166" y2="71"/>
    </g>

    <!-- DIN rail A -->
    <rect x="82" y="100" width="98" height="6" rx="2" fill="currentColor" opacity="0.12" stroke="none"/>
    <rect x="82" y="100" width="98" height="6" rx="2" stroke-width="1.5"/>
    <!-- DIN rail B -->
    <rect x="82" y="158" width="98" height="6" rx="2" fill="currentColor" opacity="0.12" stroke="none"/>
    <rect x="82" y="158" width="98" height="6" rx="2" stroke-width="1.5"/>

    <!-- modules on rail A (straddling, y 88..116) -->
    <g stroke-width="2">
      <g transform="translate(90,88)"><rect width="13" height="28" rx="2"/><line x1="6.5" y1="5" x2="6.5" y2="11"/><circle cx="6.5" cy="24" r="1"/></g>
      <g transform="translate(108,88)"><rect width="13" height="28" rx="2" fill="currentColor" opacity="0.12" stroke="currentColor"/><line x1="6.5" y1="5" x2="6.5" y2="11"/><circle cx="6.5" cy="24" r="1"/></g>
      <g transform="translate(126,88)"><rect width="13" height="28" rx="2"/><line x1="6.5" y1="5" x2="6.5" y2="11"/><circle cx="6.5" cy="24" r="1"/></g>
      <g transform="translate(144,88)"><rect width="13" height="28" rx="2"/><line x1="6.5" y1="5" x2="6.5" y2="11"/><circle cx="6.5" cy="24" r="1"/></g>
      <g transform="translate(162,88)"><rect width="13" height="28" rx="2"/><line x1="6.5" y1="5" x2="6.5" y2="11"/><circle cx="6.5" cy="24" r="1"/></g>
    </g>
    <!-- LEDs on rail A -->
    <circle cx="114.5" cy="95" r="1.6" fill="currentColor" opacity="0.9" stroke="none"/>
    <circle cx="168.5" cy="95" r="1.6" fill="currentColor" opacity="0.9" stroke="none"/>

    <!-- modules on rail B (y 146..174), one double-wide breaker -->
    <g stroke-width="2">
      <g transform="translate(90,146)"><rect width="13" height="28" rx="2"/><line x1="6.5" y1="5" x2="6.5" y2="11"/><circle cx="6.5" cy="24" r="1"/></g>
      <g transform="translate(108,146)"><rect width="13" height="28" rx="2"/><line x1="6.5" y1="5" x2="6.5" y2="11"/><circle cx="6.5" cy="24" r="1"/></g>
      <g transform="translate(126,146)"><rect width="31" height="28" rx="2" fill="currentColor" opacity="0.12" stroke="currentColor"/><line x1="8" y1="5" x2="8" y2="11"/><line x1="23" y1="5" x2="23" y2="11"/><circle cx="8" cy="24" r="1"/><circle cx="23" cy="24" r="1"/></g>
      <g transform="translate(162,146)"><rect width="13" height="28" rx="2"/><line x1="6.5" y1="5" x2="6.5" y2="11"/><circle cx="6.5" cy="24" r="1"/></g>
    </g>
    <!-- LED on rail B -->
    <circle cx="96.5" cy="153" r="1.6" fill="currentColor" opacity="0.9" stroke="none"/>

    <!-- bottom wiring duct -->
    <rect x="84" y="184" width="92" height="14" rx="2" fill="currentColor" opacity="0.06" stroke="none"/>
    <rect x="84" y="184" width="92" height="14" rx="2" stroke-width="1.5"/>
    <g stroke-width="1.5" opacity="0.8">
      <line x1="92" y1="187.5" x2="92" y2="194.5"/>
      <line x1="102" y1="187.5" x2="102" y2="194.5"/>
      <line x1="112" y1="187.5" x2="112" y2="194.5"/>
      <line x1="122" y1="187.5" x2="122" y2="194.5"/>
      <line x1="132" y1="187.5" x2="132" y2="194.5"/>
      <line x1="142" y1="187.5" x2="142" y2="194.5"/>
      <line x1="152" y1="187.5" x2="152" y2="194.5"/>
      <line x1="162" y1="187.5" x2="162" y2="194.5"/>
      <line x1="172" y1="187.5" x2="172" y2="194.5"/>
    </g>

    <!-- ===== latch on the right side face ===== -->
    <g stroke-width="2.5">
      <rect x="192" y="116" width="6" height="30" rx="3" fill="currentColor" opacity="0.06" stroke="currentColor"/>
      <circle cx="195" cy="151" r="2.4" stroke-width="1.5"/>
    </g>

    <!-- ===== hinged door, ajar (hinged on the front-left edge) ===== -->
    <path d="M72 46 L40 60 L40 192 L72 206 Z" fill="currentColor" opacity="0.06" stroke="none"/>
    <path d="M72 46 L40 60 L40 192 L72 206 Z"/>
    <!-- inner door panel -->
    <path d="M65 56 L48 63 L48 189 L65 196 Z" stroke-width="1.5"/>
    <!-- door lock cylinder near outer edge -->
    <g stroke-width="2.5">
      <circle cx="49" cy="126" r="5"/>
      <line x1="49" y1="124" x2="49" y2="129" stroke-width="1.5"/>
    </g>

    <!-- hinges bridging door and body -->
    <g stroke-width="2">
      <rect x="68" y="68" width="8" height="14" rx="3" fill="currentColor" opacity="0.12" stroke="currentColor"/>
      <rect x="68" y="172" width="8" height="14" rx="3" fill="currentColor" opacity="0.12" stroke="currentColor"/>
    </g>

  </g>
</svg>
