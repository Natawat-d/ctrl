<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== 2.5D depth: top + right slab faces (behind the front elevation) ===== -->
    <path d="M78,48 L150,48 L162,38 L90,38 Z" fill="currentColor" opacity="0.06"/>
    <path d="M150,48 L162,38 L162,186 L150,196 Z" fill="currentColor" opacity="0.06"/>
    <path d="M78,48 L150,48 L162,38 L90,38 Z" fill="none" stroke-width="2.5" opacity="0.5"/>
    <path d="M150,48 L162,38 L162,186 L150,196 Z" fill="none" stroke-width="2.5" opacity="0.5"/>
    <!-- arc-chute vents on the top slab -->
    <line x1="100" y1="48" x2="112" y2="38" stroke-width="1.5" opacity="0.4"/>
    <line x1="113" y1="48" x2="125" y2="38" stroke-width="1.5" opacity="0.4"/>
    <line x1="126" y1="48" x2="138" y2="38" stroke-width="1.5" opacity="0.4"/>
    <!-- module ribs on the right slab -->
    <line x1="150" y1="84"  x2="162" y2="74"  stroke-width="1.5" opacity="0.4"/>
    <line x1="150" y1="120" x2="162" y2="110" stroke-width="1.5" opacity="0.4"/>
    <line x1="150" y1="156" x2="162" y2="146" stroke-width="1.5" opacity="0.4"/>

    <!-- ===== main DIN module body (front elevation) with bottom DIN-clip notch ===== -->
    <path d="M86,48 L142,48 Q150,48 150,56 L150,188 Q150,196 142,196
             L128,196 L128,186 Q128,183 125,183 L103,183 Q100,183 100,186 L100,196
             L86,196 Q78,196 78,188 L78,56 Q78,48 86,48 Z"
          fill="none" stroke-width="4"/>

    <!-- ===== top terminal (line side): recess + Phillips screw ===== -->
    <rect x="90" y="56" width="48" height="22" rx="4" fill="currentColor" opacity="0.06"/>
    <rect x="90" y="56" width="48" height="22" rx="4" fill="none" stroke-width="2.5"/>
    <circle cx="114" cy="67" r="7" fill="currentColor" opacity="0.06"/>
    <circle cx="114" cy="67" r="7" fill="none" stroke-width="2.5"/>
    <line x1="109.5" y1="67" x2="118.5" y2="67" stroke-width="1.5"/>
    <line x1="114" y1="62.5" x2="114" y2="71.5" stroke-width="1.5"/>

    <!-- ===== toggle switch housing + raised lever ===== -->
    <rect x="92" y="84" width="44" height="40" rx="6" fill="currentColor" opacity="0.06"/>
    <rect x="92" y="84" width="44" height="40" rx="6" fill="none" stroke-width="2.5"/>
    <!-- status indicator dot -->
    <circle cx="114" cy="81" r="2.4" fill="currentColor" opacity="0.9" stroke="none"/>
    <!-- pivot slot at the base of the handle -->
    <line x1="99" y1="118" x2="129" y2="118" stroke-width="1.5" opacity="0.5"/>
    <!-- the lever / toggle handle (raised) -->
    <rect x="105" y="88" width="18" height="30" rx="5" fill="currentColor" opacity="0.12"/>
    <rect x="105" y="88" width="18" height="30" rx="5" fill="none" stroke-width="2.5"/>
    <line x1="109" y1="98"  x2="119" y2="98"  stroke-width="1.5" opacity="0.7"/>
    <line x1="109" y1="104" x2="119" y2="104" stroke-width="1.5" opacity="0.7"/>

    <!-- ===== front label window ===== -->
    <rect x="86" y="130" width="56" height="28" rx="4" fill="currentColor" opacity="0.06"/>
    <rect x="86" y="130" width="56" height="28" rx="4" fill="none" stroke-width="2.5"/>
    <line x1="92" y1="140" x2="136" y2="140" stroke-width="1.5" opacity="0.5"/>
    <line x1="92" y1="149" x2="124" y2="149" stroke-width="1.5" opacity="0.5"/>

    <!-- ===== bottom terminal (load side): recess + Phillips screw ===== -->
    <rect x="90" y="164" width="48" height="22" rx="4" fill="currentColor" opacity="0.06"/>
    <rect x="90" y="164" width="48" height="22" rx="4" fill="none" stroke-width="2.5"/>
    <circle cx="114" cy="175" r="7" fill="currentColor" opacity="0.06"/>
    <circle cx="114" cy="175" r="7" fill="none" stroke-width="2.5"/>
    <line x1="109.5" y1="175" x2="118.5" y2="175" stroke-width="1.5"/>
    <line x1="114" y1="170.5" x2="114" y2="179.5" stroke-width="1.5"/>

    <!-- ===== DIN-rail clip inside the bottom notch ===== -->
    <rect x="104" y="186" width="20" height="8" rx="2" fill="currentColor" opacity="0.12"/>
    <rect x="104" y="186" width="20" height="8" rx="2" fill="none" stroke-width="2.5"/>
    <line x1="114" y1="183" x2="114" y2="186" stroke-width="1.5" opacity="0.5"/>

  </g>
</svg>
