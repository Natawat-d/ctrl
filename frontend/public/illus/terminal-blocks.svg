<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Feed-through terminal block -->
    <g id="tb" stroke-linecap="round" stroke-linejoin="round">
      <!-- body panel + right bevel shade -->
      <rect x="0" y="72" width="24" height="96" rx="5" fill="currentColor" opacity="0.06"/>
      <rect x="18" y="76" width="6" height="88" rx="3" fill="currentColor" opacity="0.06"/>
      <rect x="0" y="72" width="24" height="96" rx="5" stroke="currentColor" stroke-width="4"/>
      <!-- wire landing on the terminal -->
      <line x1="12" y1="58" x2="12" y2="40" stroke="currentColor" stroke-width="4"/>
      <!-- screw collar + slotted head -->
      <rect x="3.5" y="58" width="17" height="15" rx="3.5" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="12" cy="66" r="5.4" stroke="currentColor" stroke-width="2.5"/>
      <line x1="8.2" y1="62.6" x2="15.8" y2="69.4" stroke="currentColor" stroke-width="2.5"/>
      <!-- internal conductor -->
      <line x1="12" y1="73" x2="12" y2="125" stroke="currentColor" stroke-width="1.5"/>
      <!-- front grooves -->
      <line x1="4" y1="98" x2="9" y2="98" stroke="currentColor" stroke-width="1.5"/>
      <line x1="15" y1="98" x2="20" y2="98" stroke="currentColor" stroke-width="1.5"/>
      <!-- wire entry port + conductor tip -->
      <ellipse cx="12" cy="132" rx="6.5" ry="5" fill="currentColor" opacity="0.06"/>
      <ellipse cx="12" cy="132" rx="6.5" ry="5" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="12" cy="132" r="1.3" fill="currentColor" opacity="0.9"/>
      <!-- rail-clip mouth -->
      <line x1="4" y1="150" x2="20" y2="150" stroke="currentColor" stroke-width="1.5"/>
    </g>
    <!-- End clamp / end stop -->
    <g id="clamp" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="88" width="14" height="80" rx="3.5" fill="currentColor" opacity="0.06"/>
      <rect x="9.5" y="92" width="4.5" height="72" rx="2" fill="currentColor" opacity="0.06"/>
      <rect x="0" y="88" width="14" height="80" rx="3.5" stroke="currentColor" stroke-width="4"/>
      <!-- screw collar + head -->
      <rect x="1.5" y="76" width="11" height="14" rx="3" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="7" cy="83" r="4.2" stroke="currentColor" stroke-width="2.5"/>
      <line x1="4" y1="80.6" x2="10" y2="85.4" stroke="currentColor" stroke-width="2.5"/>
      <!-- clamp hatching -->
      <line x1="3.5" y1="104" x2="10.5" y2="118" stroke="currentColor" stroke-width="1.5"/>
      <line x1="3.5" y1="118" x2="10.5" y2="132" stroke="currentColor" stroke-width="1.5"/>
      <line x1="3.5" y1="132" x2="10.5" y2="146" stroke="currentColor" stroke-width="1.5"/>
      <!-- rail-clip mouth -->
      <line x1="3" y1="150" x2="11" y2="150" stroke="currentColor" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- DIN top-hat rail -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="26" y="168" width="188" height="20" rx="4" fill="currentColor" opacity="0.06"/>
    <rect x="26" y="168" width="188" height="20" rx="4" stroke="currentColor" stroke-width="4"/>
    <rect x="31" y="172" width="178" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
    <g fill="currentColor" opacity="0.06">
      <rect x="34" y="175" width="12" height="6" rx="3"/>
      <rect x="66" y="175" width="12" height="6" rx="3"/>
      <rect x="98" y="175" width="12" height="6" rx="3"/>
      <rect x="130" y="175" width="12" height="6" rx="3"/>
      <rect x="162" y="175" width="12" height="6" rx="3"/>
      <rect x="194" y="175" width="12" height="6" rx="3"/>
    </g>
    <g stroke="currentColor" stroke-width="1.5">
      <rect x="34" y="175" width="12" height="6" rx="3"/>
      <rect x="66" y="175" width="12" height="6" rx="3"/>
      <rect x="98" y="175" width="12" height="6" rx="3"/>
      <rect x="130" y="175" width="12" height="6" rx="3"/>
      <rect x="162" y="175" width="12" height="6" rx="3"/>
      <rect x="194" y="175" width="12" height="6" rx="3"/>
    </g>
  </g>

  <!-- row of feed-through blocks -->
  <use href="#tb" x="54"/>
  <use href="#tb" x="81"/>
  <use href="#tb" x="108"/>
  <use href="#tb" x="135"/>
  <use href="#tb" x="162"/>

  <!-- end clamps at both ends -->
  <use href="#clamp" x="37"/>
  <use href="#clamp" x="189"/>
</svg>
