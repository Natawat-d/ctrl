    <line x1="190" y1="151" x2="190" y2="171" stroke-width="1.5" opacity="0.55"/>
    <path d="M180 146 L176 140 L170 140 L166 146 L166 176 L170 182 L176 182 L180 176 Z" fill="currentColor" opacity="0.12" stroke="none"/>
    <path d="M180 146 L176 140 L170 140 L166 146 L166 176 L170 182 L176 182 L180 176 Z" stroke-width="2.5"/>

