    <line x1="120" y1="86" x2="113" y2="92" stroke-width="2.5" opacity="0.6"/>
    <circle cx="120" cy="86" r="4.5" fill="currentColor" opacity="0.9" stroke="none"/>
    <circle cx="120" cy="86" r="4.5" stroke-width="2.5"/>

