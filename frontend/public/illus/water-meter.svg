    <line x1="50" y1="151" x2="50" y2="171" stroke-width="1.5" opacity="0.55"/>
    <!-- hex coupling nut -->
    <path d="M60 146 L64 140 L70 140 L74 146 L74 176 L70 182 L64 182 L60 176 Z" fill="currentColor" opacity="0.12" stroke="none"/>
    <path d="M60 146 L64 140 L70 140 L74 146 L74 176 L70 182 L64 182 L60 176 Z" stroke-width="2.5"/>

