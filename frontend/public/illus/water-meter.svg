      <line x1="164" y1="86" x2="156" y2="86"/>
      <line x1="158.1" y1="108" x2="151.2" y2="104"/>
      <line x1="142" y1="124.1" x2="138" y2="117.2"/>
      <line x1="120" y1="130" x2="120" y2="122"/>
      <line x1="98" y1="124.1" x2="102" y2="117.2"/>
