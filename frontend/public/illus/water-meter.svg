      <line x1="151.1" y1="54.9" x2="147.6" y2="58.4"/>
      <line x1="162.5" y1="74.6" x2="157.7" y2="75.9"/>
      <line x1="162.5" y1="97.4" x2="157.7" y2="96.1"/>
      <line x1="151.1" y1="117.1" x2="147.6" y2="113.6"/>
      <line x1="131.4" y1="128.5" x2="130.1" y2="123.7"/>
      <line x1="108.6" y1="128.5" x2="109.9" y2="123.7"/>
      <line x1="88.9" y1="117.1" x2="92.4" y2="113.6"/>
      <line x1="77.5" y1="97.4" x2="82.3" y2="96.1"/>
      <line x1="77.5" y1="74.6" x2="82.3" y2="75.9"/>
      <line x1="88.9" y1="54.9" x2="92.4" y2="58.4"/>
