<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520">
  <!-- CTRL background tile — line-art มิเตอร์น้ำ-ไฟ จาง ๆ บนพื้นขาว -->
  <g fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.055">

    <!-- เกจมิเตอร์ (บนซ้าย) -->
    <g transform="translate(58,66) rotate(-8)">
      <circle cx="0" cy="0" r="26"/>
      <path d="M-16 10 A19 19 0 1 1 16 10"/>
      <line x1="0" y1="0" x2="9" y2="-12"/>
      <circle cx="0" cy="0" r="2.4"/>
      <line x1="-13" y1="-9" x2="-16" y2="-12"/>
      <line x1="0" y1="-16" x2="0" y2="-20"/>
      <line x1="13" y1="-9" x2="16" y2="-12"/>
    </g>

    <!-- สายฟ้า -->
    <g transform="translate(212,140) rotate(10)">
      <path d="M6 -20 L-8 2 h9 l-3 20 L18 -4 h-9 z"/>
    </g>

    <!-- หยดน้ำ -->
    <g transform="translate(392,84) rotate(6)">
      <path d="M0 -22 C10 -8 16 0 16 8 A16 16 0 1 1 -16 8 C-16 0 -10 -8 0 -22 z"/>
      <path d="M-7 8 A8 8 0 0 0 0 16"/>
    </g>

    <!-- กล่องมิเตอร์ DIN + จอ -->
    <g transform="translate(120,268) rotate(-5)">
      <rect x="-26" y="-30" width="52" height="60" rx="5"/>
      <rect x="-18" y="-20" width="36" height="16" rx="2"/>
      <path d="M-12 -12 h8 M0 -12 h6 M10 -12 h2"/>
      <circle cx="-12" cy="14" r="4"/>
      <circle cx="12" cy="14" r="4"/>
      <line x1="-4" y1="14" x2="4" y2="14"/>
    </g>

    <!-- ใบเสร็จ/บิล -->
    <g transform="translate(330,238) rotate(7)">
      <path d="M-18 -26 v50 l6 -4 6 4 6 -4 6 4 6 -4 6 4 v-50 l-6 4 -6 -4 -6 4 -6 -4 -6 4 z" transform="scale(1.05)"/>
      <line x1="-9" y1="-8" x2="11" y2="-8"/>
      <line x1="-9" y1="0" x2="11" y2="0"/>
      <line x1="-9" y1="8" x2="4" y2="8"/>
    </g>

    <!-- ปลั๊ก -->
    <g transform="translate(470,338) rotate(-12)">
      <path d="M-8 -18 v10 M8 -18 v10"/>
      <path d="M-14 -8 h28 v8 a14 14 0 0 1 -28 0 z"/>
      <path d="M0 14 v10 c0 6 -8 6 -10 3"/>
    </g>

    <!-- ก๊อกน้ำ + หยด -->
    <g transform="translate(84,438) rotate(4)">
      <path d="M-20 -6 h18 a10 10 0 0 1 10 10 v6 h-10 v-4 a4 4 0 0 0 -4 -4 h-14 z"/>
      <path d="M-20 -12 v12 M-26 -6 h12"/>
      <path d="M3 18 c3 4 5 7 5 9 a5 5 0 1 1 -10 0 c0 -2 2 -5 5 -9 z"/>
    </g>

    <!-- คลื่นสัญญาณ (data) -->
    <g transform="translate(258,392) rotate(-6)">
      <path d="M-24 12 a24 24 0 0 1 48 0"/>
      <path d="M-15 12 a15 15 0 0 1 30 0"/>
      <path d="M-6 12 a6 6 0 0 1 12 0"/>
      <circle cx="0" cy="16" r="2"/>
    </g>

    <!-- กราฟเส้น -->
    <g transform="translate(414,472) rotate(3)">
      <path d="M-24 12 L-10 0 L0 6 L12 -10 L24 -2"/>
      <path d="M-24 -14 v30 h48"/>
    </g>

    <!-- เข็มวัดเล็ก (เติมช่องว่าง) -->
    <g transform="translate(478,180) rotate(14)">
      <circle cx="0" cy="0" r="13"/>
      <line x1="0" y1="0" x2="6" y2="-7"/>
      <circle cx="0" cy="0" r="1.6"/>
    </g>
    <g transform="translate(28,168) rotate(-14)">
      <path d="M4 -12 L-5 1 h6 l-2 12 L10 -2 h-6 z"/>
    </g>
    <g transform="translate(196,486) rotate(10)">
      <path d="M0 -12 C5 -5 8 -1 8 3 A8 8 0 1 1 -8 3 C-8 -1 -5 -5 0 -12 z"/>
    </g>
  </g>

  <!-- จุด grid จาง ๆ -->
  <g fill="#64748b" opacity="0.04">
    <circle cx="20" cy="20" r="1.1"/><circle cx="150" cy="20" r="1.1"/><circle cx="280" cy="20" r="1.1"/><circle cx="410" cy="20" r="1.1"/>
    <circle cx="85" cy="150" r="1.1"/><circle cx="215" cy="150" r="1.1"/><circle cx="345" cy="150" r="1.1"/><circle cx="475" cy="150" r="1.1"/>
    <circle cx="20" cy="280" r="1.1"/><circle cx="150" cy="280" r="1.1"/><circle cx="280" cy="280" r="1.1"/><circle cx="410" cy="280" r="1.1"/>
    <circle cx="85" cy="410" r="1.1"/><circle cx="215" cy="410" r="1.1"/><circle cx="345" cy="410" r="1.1"/><circle cx="475" cy="410" r="1.1"/>
  </g>
</svg>
