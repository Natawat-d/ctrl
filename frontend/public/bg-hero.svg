<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- CTRL hero scene — สกายไลน์หอพัก + สายไฟ + ท่อน้ำ + เกจมิเตอร์ (โทนฟ้าจาง) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#eaf1fb" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e3ecf9" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- เกจใหญ่มุมบน (จางมาก) -->
  <g fill="none" stroke="#94a8c8" stroke-width="2" opacity="0.10">
    <circle cx="120" cy="90" r="70"/>
    <path d="M75 122 A55 55 0 1 1 165 122"/>
    <line x1="120" y1="90" x2="150" y2="55"/>
    <circle cx="120" cy="90" r="5"/>
  </g>
  <g fill="none" stroke="#94a8c8" stroke-width="2" opacity="0.09">
