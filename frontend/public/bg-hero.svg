    <path d="M244 496 v-8 h32 v8" fill="none"/>
    <line x1="1320" y1="560" x2="1320" y2="516"/>
    <circle cx="1320" cy="512" r="4" fill="#b9c9e2"/>
  </g>

  <!-- มิเตอร์ติดผนังตึก (กล่องเล็ก + เข็ม) -->
  <g fill="#ffffff" stroke="#8fa9d0" stroke-width="2">
    <rect x="120" y="812" width="34" height="42" rx="4"/>
    <circle cx="137" cy="828" r="9" fill="none"/>
    <line x1="137" y1="828" x2="142" y2="822"/>
    <rect x="129" y="842" width="16" height="6" rx="1.5" fill="#d8e2f2" stroke="none"/>

    <rect x="330" y="800" width="34" height="42" rx="4"/>
    <circle cx="347" cy="816" r="9" fill="none"/>
    <line x1="347" y1="816" x2="352" y2="810"/>
    <rect x="339" y="830" width="16" height="6" rx="1.5" fill="#d8e2f2" stroke="none"/>

