      <rect x="416" y="702" width="22" height="17" rx="2"/><rect x="452" y="702" width="22" height="17" rx="2"/><rect x="488" y="702" width="18" height="17" rx="2"/>
      <rect x="416" y="744" width="22" height="17" rx="2"/><rect x="452" y="744" width="22" height="17" rx="2"/><rect x="488" y="744" width="18" height="17" rx="2"/>
      <rect x="416" y="786" width="22" height="17" rx="2"/><rect x="452" y="786" width="22" height="17" rx="2"/><rect x="488" y="786" width="18" height="17" rx="2"/>
    </g>
    <!-- ตึก 4 -->
    <g>
      <rect x="1086" y="674" width="22" height="17" rx="2"/><rect x="1122" y="674" width="22" height="17" rx="2"/><rect x="1158" y="674" width="22" height="17" rx="2"/>
      <rect x="1086" y="716" width="22" height="17" rx="2"/><rect x="1122" y="716" width="22" height="17" rx="2"/><rect x="1158" y="716" width="22" height="17" rx="2"/>
      <rect x="1086" y="758" width="22" height="17" rx="2"/><rect x="1122" y="758" width="22" height="17" rx="2"/><rect x="1158" y="758" width="22" height="17" rx="2"/>
