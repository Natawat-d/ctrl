    <rect x="-20" y="600" width="190" height="300" rx="3"/>
    <!-- ตึก 2 -->
    <rect x="210" y="530" width="150" height="370" rx="3"/>
    <!-- ตึก 3 เตี้ย -->
    <rect x="400" y="680" width="120" height="220" rx="3"/>
    <!-- ตึก 4 ขวา -->
    <rect x="1070" y="650" width="130" height="250" rx="3"/>
    <!-- ตึก 5 -->
    <rect x="1240" y="560" width="160" height="340" rx="3"/>
    <!-- ตึก 6 ขวาสุด -->
    <rect x="1440" y="620" width="180" height="280" rx="3"/>
  </g>

  <!-- หน้าต่าง -->
  <g fill="#d8e2f2">
    <!-- ตึก 1 -->
    <g>
      <rect x="8" y="625" width="26" height="20" rx="2"/><rect x="52" y="625" width="26" height="20" rx="2"/><rect x="96" y="625" width="26" height="20" rx="2"/><rect x="140" y="625" width="20" height="20" rx="2"/>
      <rect x="8" y="672" width="26" height="20" rx="2"/><rect x="52" y="672" width="26" height="20" rx="2"/><rect x="96" y="672" width="26" height="20" rx="2"/><rect x="140" y="672" width="20" height="20" rx="2"/>
      <rect x="8" y="719" width="26" height="20" rx="2"/><rect x="52" y="719" width="26" height="20" rx="2"/><rect x="96" y="719" width="26" height="20" rx="2"/><rect x="140" y="719" width="20" height="20" rx="2"/>
      <rect x="8" y="766" width="26" height="20" rx="2"/><rect x="52" y="766" width="26" height="20" rx="2"/><rect x="96" y="766" width="26" height="20" rx="2"/><rect x="140" y="766" width="20" height="20" rx="2"/>
    </g>
    <!-- ตึก 2 -->
