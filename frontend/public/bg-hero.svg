      <rect x="1458" y="688" width="24" height="18" rx="2"/><rect x="1498" y="688" width="24" height="18" rx="2"/><rect x="1538" y="688" width="24" height="18" rx="2"/><rect x="1578" y="688" width="20" height="18" rx="2"/>
      <rect x="1458" y="732" width="24" height="18" rx="2"/><rect x="1498" y="732" width="24" height="18" rx="2"/><rect x="1538" y="732" width="24" height="18" rx="2"/><rect x="1578" y="732" width="20" height="18" rx="2"/>
