      <rect x="228" y="556" width="24" height="18" rx="2"/><rect x="268" y="556" width="24" height="18" rx="2"/><rect x="308" y="556" width="24" height="18" rx="2"/>
      <rect x="228" y="600" width="24" height="18" rx="2"/><rect x="268" y="600" width="24" height="18" rx="2"/><rect x="308" y="600" width="24" height="18" rx="2"/>
      <rect x="228" y="644" width="24" height="18" rx="2"/><rect x="268" y="644" width="24" height="18" rx="2"/><rect x="308" y="644" width="24" height="18" rx="2"/>
      <rect x="228" y="688" width="24" height="18" rx="2"/><rect x="268" y="688" width="24" height="18" rx="2"/><rect x="308" y="688" width="24" height="18" rx="2"/>
      <rect x="228" y="732" width="24" height="18" rx="2"/><rect x="268" y="732" width="24" height="18" rx="2"/><rect x="308" y="732" width="24" height="18" rx="2"/>
    </g>
    <!-- ตึก 3 -->
