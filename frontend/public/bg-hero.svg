  <g stroke="#9db2d4" stroke-width="2.5" fill="none" opacity="0.85">
    <!-- เสาซ้าย -->
    <line x1="620" y1="900" x2="620" y2="520"/>
    <line x1="585" y1="548" x2="655" y2="548"/>
    <line x1="593" y1="576" x2="647" y2="576"/>
    <!-- ลูกถ้วย -->
    <line x1="592" y1="548" x2="592" y2="540"/><line x1="648" y1="548" x2="648" y2="540"/>
    <line x1="600" y1="576" x2="600" y2="568"/><line x1="640" y1="576" x2="640" y2="568"/>
    <!-- เสาขวา -->
    <line x1="980" y1="900" x2="980" y2="540"/>
    <line x1="948" y1="566" x2="1012" y2="566"/>
    <line x1="955" y1="592" x2="1005" y2="592"/>
    <line x1="954" y1="566" x2="954" y2="558"/><line x1="1006" y1="566" x2="1006" y2="558"/>
    <!-- สายโยงระหว่างเสา (หย่อนแบบ catenary) -->
    <path d="M592 540 C 700 585, 850 590, 954 558"/>
    <path d="M648 540 C 740 600, 880 605, 1006 558"/>
    <!-- โยงเข้าตึกซ้าย/ขวา -->
    <path d="M592 540 C 480 570, 400 590, 335 610"/>
    <path d="M1006 558 C 1100 590, 1180 620, 1245 650"/>
  </g>

  <!-- ═══════════ ท่อน้ำใต้ดิน + วาล์ว ═══════════ -->
  <g stroke="#8fb8d8" stroke-width="3" fill="none" opacity="0.7">
    <path d="M0 878 H1600" stroke-dasharray="16 10"/>
  </g>
  <g fill="#ffffff" stroke="#8fb8d8" stroke-width="2" opacity="0.9">
    <circle cx="520" cy="878" r="9"/>
    <line x1="520" y1="869" x2="520" y2="887"/>
    <circle cx="1060" cy="878" r="9"/>
    <line x1="1051" y1="878" x2="1069" y2="878"/>
  </g>

  <!-- นก 2-3 ตัว บนฟ้า (กันโล่งเกิน) -->
  <g stroke="#a8bbd8" stroke-width="2" fill="none" opacity="0.5">
    <path d="M700 180 q7 -8 14 0 M714 180 q7 -8 14 0"/>
    <path d="M760 155 q6 -7 12 0 M772 155 q6 -7 12 0"/>
  </g>
</svg>
