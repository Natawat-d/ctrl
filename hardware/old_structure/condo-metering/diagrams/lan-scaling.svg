y="624" width="258" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="931" y="645" font-size="9.5" text-anchor="middle" font-weight="400" fill="#64748b">PSU 450 + ตู้ชั้น 2,600 + เบ็ดเตล็ด 1,050 + riser 600</text><text x="394" y="690" font-size="10.5" text-anchor="start" font-weight="400" fill="#64748b">แต่ละ gateway = 1 IP + 1 พอร์ต Modbus-TCP ที่ Mini PC ต้อง config เพิ่ม → ชั้นเยอะ = config เยอะ</text><text x="40" y="730" font-size="15" text-anchor="start" font-weight="700" fill="#1f3864">ต้อง switch ใหญ่แค่ไหน + ต้นทุนต่อห้อง</text><rect x="40" y="746" width="462" height="250" rx="9" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.6"/><text x="58" y="776" font-size="16" text-anchor="start" font-weight="700" fill="#0f172a">4 ชั้น · 40 ห้อง</text><line x1="58" y1="788" x2="484" y2="788" stroke="#94a3b8" stroke-width="1"/><text x="58" y="814" font-size="11.5" text-anchor="start" font-weight="400" fill="#64748b">gateway ทั้งหมด</text><text x="484" y="814" font-size="12" text-anchor="end" font-weight="700" fill="#0f172a">gateway 8 ตัว (4+4)</text><text x="58" y="840" font-size="11.5" text-anchor="start" font-weight="400" fill="#64748b">switch ที่ใช้</text><text x="484" y="840" font-size="12" text-anchor="end" font-weight="700" fill="#0f172a">switch 5-port ×2</text><text x="484" y="866" font-size="10.5" text-anchor="end" font-weight="400" fill="#64748b">1 ตัว/ฝั่งพอ (uplink+4)</text><line x1="58" y1="892" x2="484" y2="892" stroke="#94a3b8" stroke-width="1"/><text x="58" y="922" font-size="12" text-anchor="start" font-weight="400" fill="#64748b">ต้นทุน/ห้อง (อุปกรณ์)</text><text x="484" y="926" font-size="30" text-anchor="end" font-weight="700" fill="#16a34a">2,081 ฿</text><text x="58" y="958" font-size="10.5" text-anchor="start" font-weight="400" fill="#64748b">แยก: ส่วนกลาง / LAN / sensor</text><text x="484" y="958" font-size="12" text-anchor="end" font-weight="700" fill="#0f172a">382 / 748 / 951 ฿</text><rect x="518" y="746" width="462"