b">switch ที่ใช้</text><text x="1440" y="840" font-size="12" text-anchor="end" font-weight="700" fill="#0f172a">switch 16-port ×2</text><text x="1440" y="866" font-size="10.5" text-anchor="end" font-weight="400" fill="#64748b">ฝั่งละ 1 ตัวจบ · เป็นระเบียบ</text><line x1="1014" y1="892" x2="1440" y2="892" stroke="#94a3b8" stroke-width="1"/><text x="1014" y="922" font-size="12" text-anchor="start" font-weight="400" fill="#64748b">ต้นทุน/ห้อง (อุปกรณ์)</text><text x="1440" y="926" font-size="30" text-anchor="end" font-weight="700" fill="#16a34a">1,826 ฿</text><text x="1014" y="958" font-size="10.5" text-anchor="start" font-weight="400" fill="#64748b">แยก: ส่วนกลาง / LAN / sensor</text><text x="1440" y="958" font-size="12" text-anchor="end" font-weight="700" fill="#0f172a">127 / 748 / 951 ฿</text><text x="40" y="1014" font-size="11" text-anchor="start" font-weight="400" fill="#64748b">ราคาอ้างอิง BOM MVP + BOM คอนโด (ส.ค. 2026) · THB · ไม่รวม VAT 7% / ค่าแรง · งานหน้างาน (สายเมน/ท่อ) เพิ่ม ~1,134 ฿/ห้อง (ตัดออกได้ถ้ามีอยู่แล้ว)</text></svg>