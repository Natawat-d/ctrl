<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1040" width="1500" height="1040" font-family="Leelawadee UI, Leelawadee, Tahoma, Segoe UI, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs><rect x="0" y="0" width="1500" height="1040" fill="#ffffff"/><text x="40" y="46" font-size="24" text-anchor="start" font-weight="700" fill="#0f172a">การขยาย LAN ตามจำนวนชั้น + ต้นทุนแยกหมวด (10 ห้อง/ชั้น)</text><text x="40" y="71" font-size="13" text-anchor="start" font-weight="400" fill="#64748b">1 ชั้น = gateway 2 ตัว (ไฟ+น้ำ แยกเครือข่าย) → switch · ยิ่งหลายชั้น พอร์ต/คอนฟิกยิ่งมาก → ใช้ switch ตัวใหญ่ขึ้น</text><rect x="1300" y="26" width="165" height="52" rx="9" fill="#111827" stroke="#111827" stroke-width="1.5"/><text x="1382" y="48" font-size="13" text-anchor="middle" font-weight="700" fill="#94a3b8">SHEET C2</text><text x="1382" y="68" font-size="10.5" text-anchor="middle" font-weight="400" fill="#cbd5e1">cost + LAN scaling</text><line x1="40" y1="88" x2="1465" y2="88" stroke="#0f172a" stroke-width="2.5"/><text x="40" y="120" font-size="15" text-anchor="start" font-weight="700" fill="#1f3864">ต้นทุนแยก 3 หมวด</text><rect x="40" y="134" width="462" height="118" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="56" y="160" font-size="13.5" text-anchor="start" font-weight="700" fill="#0f172a">1 · ส่วนกลาง (คงที่ทั้งอาคาร)</text><text x="56" y="182" font-size="10.5" text-anchor="start" font-weight="400" fill="#64748b">Mini PC 4×LAN + ตู้ Main + UPS + เมนไฟ + มิเตอร์ส่วนกลาง</text><text x="56" y="224" font-size="26" text-anchor="start" font-weight="700" fill="#6366f1">15,281 ฿</text><text x="56" y="244" font-size="10.5" text-anchor="start" font-weight="400" fill="#64748b">จ่ายครั้งเดียว · เฉลี่ย/ห้องถูกลงเมื่ออาคารใหญ่</text><rect x="518" y="134" width="462" height="118" rx="9" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/><text x="534" y="160" font-size="13.5" text-anchor="start" font-weight="700" fill="#0f172a">2 · LAN/เครือข่าย (ต่อชั้น)</text><text x="534" y="182" font-size="10.5" text-anchor="start" font-weight="400" fill="#64748b">gateway ไฟ+น้ำ ×2 · PSU · ESP32 นับพัลส์ · ตู้ชั้น · riser</text><text x="534" y="224" font-size="26" text-anchor="start" font-weight="700" fill="#0891b2">7,253 ฿/ชั้น</text><text x="534" y="244" font-size="10.5" text-anchor="start" font-weight="400" fill="#64748b">÷10 = 725 ฿/ห้อง  +switch 22.5 ฿/ห้อง</text><rect x="996" y="134" width="462" height="118" rx="9" fill="#fff3cd" stroke="#ea580c" stroke-width="1.6"/><text x="1012" y="160" font-size="13.5" text-anchor="start" font-weight="700" fill="#0f172a">3 · Sensor (ต่อห้อง)</text><text x="1012" y="182" font-size="10.5" text-anchor="start" font-weight="400" fill="#64748b">มิเตอร์ไฟ DDS238 396 + มิเตอร์น้ำพัลส์ 350 + MCB 85 + เบ็ดเตล็ด 120</text><text x="1012" y="224" font-size="26" text-anchor="start" font-weight="700" fill="#ea580c">951 ฿/ห้อง</text><text x="1012" y="244" font-size="10.5" text-anchor="start" font-weight="400" fill="#64748b">คงที่ทุกขนาดอาคาร</text><text x="40" y="300" font-size="15" text-anchor="start" font-weight="700" fill="#1f3864">โครงสร้างเครือข่าย (แยก 2 ระบบทางกายภาพ)</text><rect x="60" y="330" width="250" height="118" rx="9" fill="#111827" stroke="#000" stroke-width="1.8"/><text x="185" y="356" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">Mini PC 4×LAN</text><text x="185" y="376" font-size="10.5" text-anchor="middle" font-weight="400" fill="#9ca3af">poll ทุก gateway ขนานกัน</text><rect x="74" y="392" width="52" height="40" rx="5" fill="#1f2937" stroke="#64748b" stroke-width="1.4"/><text x="100" y="410" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff">LAN0</text><text x="100" y="425" font-size="8" text-anchor="middle" font-weight="400" fill="#cbd5e1">ISP/เน็ต</text><rect x="132" y="392" width="52" height="40" rx="5" fi